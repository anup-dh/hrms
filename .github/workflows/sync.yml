name: Sync Fork with Frappe Upstream

on:
  workflow_dispatch: 

# FIX 1: Explicitly request permission to push code
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v3
        with:
          ref: version-15 
          # FIX 2: Download full history so Git can perform the merge
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Sync with Upstream
        run: |
          git remote add upstream https://github.com/frappe/hrms.git
          git fetch upstream
          git merge upstream/version-15
          git push origin version-15
